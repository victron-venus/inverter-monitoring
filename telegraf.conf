# Telegraf Configuration for Inverter Monitoring
# Collects data from MQTT and sends to InfluxDB

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "cerbo"
  omit_hostname = false

# =============================================================================
# OUTPUT: InfluxDB v2
# =============================================================================

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# =============================================================================
# INPUT: MQTT - Inverter State
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["inverter/state"]
  topic_tag = ""
  qos = 0
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "inverter"
    
    # Power metrics
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "setpoint"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gt"
      rename = "grid_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "filtered_gt"
      rename = "grid_power_filtered"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bp"
      rename = "battery_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cp"
      rename = "consumption_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "sp"
      rename = "solar_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_total"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "tasmota_total"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "solar_total"
      type = "float"

    # Battery metrics
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bv"
      rename = "battery_voltage"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bc"
      rename = "battery_current"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "soc"
      rename = "battery_soc"
      type = "float"

    # EV metrics
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_power"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_charging_kw"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "car_soc"
      type = "float"

    # Water
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "water_level"
      type = "float"

    # Status flags
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dry_run"
      type = "bool"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ha_connected"
      type = "bool"

    # ESS mode
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ess_mode"
      type = "int"

    # Uptime
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      type = "int"

# =============================================================================
# INPUT: MQTT - Battery Chain 1 (from ESP32 BMS)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery/+/+"]
  topic_tag = "topic"
  qos = 0
  data_format = "value"
  data_type = "float"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "battery/+/+"
    measurement = "battery_chain1"
    tags = "battery/_/field"

# =============================================================================
# INPUT: MQTT - Battery Chain 2 (from ESP32 BMS)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery2/+/+"]
  topic_tag = "topic"
  qos = 0
  data_format = "value"
  data_type = "float"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "battery2/+/+"
    measurement = "battery_chain2"
    tags = "battery/_/field"

# =============================================================================
# INPUT: MQTT - Individual MPPT data
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = [
    "N/+/solarcharger/+/Yield/Power",
    "N/+/solarcharger/+/Pv/V",
    "N/+/solarcharger/+/Dc/0/Current"
  ]
  topic_tag = "topic"
  qos = 0
  data_format = "json"
  json_query = "value"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "N/+/solarcharger/+/+"
    measurement = "mppt"
    tags = "_/portal_id/type/instance/field"
