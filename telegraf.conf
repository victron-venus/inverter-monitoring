# Telegraf Configuration for Inverter Monitoring

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "1s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "cerbo"
  omit_hostname = false

# =============================================================================
# OUTPUT: InfluxDB v2
# =============================================================================

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"

# =============================================================================
# INPUT: MQTT - Inverter State (main JSON payload)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["inverter/state"]
  topic_tag = ""
  qos = 0
  connection_timeout = "30s"
  data_format = "json_v2"
  name_override = "inverter"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "inverter"

    # Battery fields
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "setpoint"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gt"
      rename = "grid_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "filtered_gt"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_voltage"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_current"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_soc"
      type = "float"
      optional = true

    # Solar fields
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "tasmota_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "solar_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total"
      type = "float"
      optional = true

    # EV fields
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_charging_kw"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "car_soc"
      type = "float"
      optional = true

    # Water level
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "water_level"
      type = "float"
      optional = true

    # Uptime
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      type = "int"
      optional = true

    # Individual MPPT powers
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_individual.0"
      rename = "mppt_0_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_individual.1"
      rename = "mppt_1_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_individual.2"
      rename = "mppt_2_power"
      type = "float"
      optional = true

    # Individual Tasmota powers
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "tasmota_individual.0"
      rename = "tasmota_0_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "tasmota_individual.1"
      rename = "tasmota_1_power"
      type = "float"
      optional = true

    # Daily energy stats from Home Assistant
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.mppt_daily.0"
      rename = "mppt_0_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.mppt_daily.1"
      rename = "mppt_1_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.mppt_daily.2"
      rename = "mppt_2_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.tasmota_daily.0"
      rename = "tasmota_0_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.tasmota_daily.1"
      rename = "tasmota_1_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.pv_total_daily"
      rename = "pv_total_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.battery_in"
      rename = "battery_in_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.battery_out"
      rename = "battery_out_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.grid_kwh"
      rename = "grid_daily_kwh"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "daily_stats.produced_today"
      rename = "produced_today_kwh"
      type = "float"
      optional = true

# =============================================================================
# INPUT: MQTT - Battery Chain 1&2 (aggregated sensors)
# Topics: battery/sensor/+/state, battery2/sensor/+/state - simple float values
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery/sensor/+/state"]
  topic_tag = "topic"
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "battery_chain1"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery2/sensor/+/state"]
  topic_tag = "topic"
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "battery_chain2"

# =============================================================================
# INPUT: MQTT - MPPT Individual (optional, lower frequency)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["mppt/+/state"]
  topic_tag = "topic"
  qos = 0
  data_format = "json_v2"
  name_override = "mppt"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "mppt"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "voltage"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "current"
      type = "float"
      optional = true

# =============================================================================
# INPUT: System (Telegraf self-monitoring - low overhead)
# =============================================================================

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false
  fieldexclude = ["time_*"]

[[inputs.mem]]

[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]
  interfaces = ["eth0", "wlan0"]
  fieldexclude = ["icmp*", "ip*", "tcp*", "udp*"]

