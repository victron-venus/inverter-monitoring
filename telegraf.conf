# Telegraf Configuration for Inverter Monitoring
# Detailed collection of all battery cells, temperatures, and sensors

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "cerbo"
  omit_hostname = false

# =============================================================================
# OUTPUT: InfluxDB v2
# =============================================================================

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# =============================================================================
# INPUT: MQTT - Inverter State (main JSON payload)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["inverter/state"]
  topic_tag = ""
  qos = 0
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "inverter"
    
    # Power metrics
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "setpoint"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gt"
      rename = "grid_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "filtered_gt"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_voltage"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_current"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_soc"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "tasmota_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "solar_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total"
      type = "float"
      optional = true

    # EV
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_charging_kw"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "car_soc"
      type = "float"
      optional = true

    # Water
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "water_level"
      type = "float"
      optional = true

    # Status
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ess_mode"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      type = "int"
      optional = true

# =============================================================================
# INPUT: MQTT - Battery Chain 1 Cell Voltages
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery/sensor/voltage_cell*"]
  topic_tag = ""
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "battery_cells"
  
  [inputs.mqtt_consumer.tags]
    chain = "1"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "battery/sensor/+/state"
    tags = "_/_/cell/_"
    
# =============================================================================
# INPUT: MQTT - Battery Chain 2 Cell Voltages  
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery2/sensor/voltage_cell*"]
  topic_tag = ""
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "battery_cells"
  
  [inputs.mqtt_consumer.tags]
    chain = "2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "battery2/sensor/+/state"
    tags = "_/_/cell/_"

# =============================================================================
# INPUT: MQTT - Battery Chain 1 BMS Data (SOC, voltage, current, power, temp)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = [
    "battery/sensor/soc_bms*/state",
    "battery/sensor/voltage_bms*/state",
    "battery/sensor/current_bms*/state",
    "battery/sensor/power_bms*/state",
    "battery/sensor/temperature1_bms*/state",
    "battery/sensor/cycles_bms*/state",
    "battery/sensor/capacity_remaining_bms*/state"
  ]
  topic_tag = ""
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "battery_bms"
  
  [inputs.mqtt_consumer.tags]
    chain = "1"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "battery/sensor/+/state"
    tags = "_/_/sensor/_"

