# Telegraf Configuration for Inverter Monitoring
# Collects data from MQTT and sends to InfluxDB

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "cerbo"
  omit_hostname = false

# =============================================================================
# OUTPUT: InfluxDB v2
# =============================================================================

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# =============================================================================
# INPUT: MQTT - Inverter State (main JSON payload)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["inverter/state"]
  topic_tag = ""
  qos = 0
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "inverter"
    
    # Power metrics (use actual field names from payload)
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "setpoint"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "gt"
      rename = "grid_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "filtered_gt"
      rename = "grid_power_filtered"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bp"
      rename = "battery_power_short"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mppt_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "tasmota_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "solar_total"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pv_total"
      type = "float"
      optional = true

    # Battery metrics
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bv"
      rename = "battery_voltage_short"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_voltage"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bc"
      rename = "battery_current_short"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_current"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "battery_soc"
      type = "float"
      optional = true

    # EV metrics
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_power"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ev_charging_kw"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "car_soc"
      type = "float"
      optional = true

    # Water
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "water_level"
      type = "float"
      optional = true

    # Status flags
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dry_run"
      type = "bool"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ha_connected"
      type = "bool"
      optional = true

    # ESS mode
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ess_mode"
      type = "int"
      optional = true

    # Uptime
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime"
      type = "int"
      optional = true

# =============================================================================
# INPUT: MQTT - Battery Chain 1 (from ESP32 BMS)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery/#"]
  topic_tag = "topic"
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "battery_chain1"

# =============================================================================
# INPUT: MQTT - Battery Chain 2 (from ESP32 BMS)
# =============================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  topics = ["battery2/#"]
  topic_tag = "topic"
  qos = 0
  data_format = "value"
  data_type = "float"
  name_override = "battery_chain2"
