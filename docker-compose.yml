version: '3.8'

services:
  # Webhook listener for GitHub auto-deploy (optional)
  # Expose via Cloudflare Argo tunnel to receive GitHub webhooks
  webhook:
    build: ./webhook
    container_name: deploy-webhook
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - DEPLOY_SCRIPT=/app/deploy-local.sh
    volumes:
      - .:/deploy:rw
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring
    profiles:
      - webhook  # Only start with: docker-compose --profile webhook up -d

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_URL=http://192.168.167.25:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG:-home}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-inverter}
      - MQTT_HOST=192.168.160.150
    networks:
      - monitoring

  # Loki for logs (optional)
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # Promtail to ship logs to Loki
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  loki-data:
