name: Release Bot

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0

    - name: Validate release metadata
      env:
        TAG: ${{ github.ref_name }}
      run: |
        test "$TAG" = "$(tr -d '\r\n' < version)"
        test -s release.txt
        test "$(head -n 1 release.txt)" = "Inverter Monitoring $TAG"

    - name: Create or update GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        # Re-running the workflow preserves the reviewed notes for this tag.
        if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release edit "$TAG" --title "$TAG" --notes-file release.txt -R "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release.txt -R "$GITHUB_REPOSITORY"
        fi
