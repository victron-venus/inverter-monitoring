name: Release Bot

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  discussions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0

    - name: Extract tag
      id: tag
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

    - name: Create or update GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.TAG }}
      run: |
        NOTES=$(printf 'Automated release %s\n\n## Assets\n- Binary artifacts built by CI/CD\n- Source code (auto-attached)' "$TAG")
        # Idempotent: re-pushing a tag (or a manually created release) must
        # not fail the pipeline with "already_exists" - update notes instead.
        if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release edit "$TAG" --title "$TAG" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
        fi
